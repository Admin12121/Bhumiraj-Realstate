name: bhumiraj-estates
services:
  nginx:
    image: nginx:1.29-alpine
    ports: ["127.0.0.1:80:80"]
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      target: dev
      args:
        NEXT_PUBLIC_APP_URL: "http://localhost"
        NEXT_PUBLIC_CDN_BASE_URL: "http://localhost:9000/bhumiraj-public"
        NEXT_PUBLIC_UPLOAD_ORIGIN: "http://localhost:9000"
        NEXT_PUBLIC_MAP_STYLE_URL: "https://demotiles.maplibre.org/style.json"
    working_dir: /workspace
    command: >
      sh -lc "
        bun install
        # Dev compiles routes on first request, which makes the first click on
        # a link look like it did nothing. Warm the common entry points.
        (
          until wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1; do sleep 2; done
          for route in /sign-in /sign-up /properties /agents /account /admin; do
            wget -qO- \"http://127.0.0.1:3000$$route\" >/dev/null 2>&1 || true
          done
          echo 'Warmed the common routes.'
        ) &
        exec bun --cwd apps/web dev --hostname 0.0.0.0
      "
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      APP_URL: http://localhost
      NEXT_PUBLIC_APP_URL: http://localhost
      NEXT_PUBLIC_CDN_BASE_URL: http://localhost:9000/bhumiraj-public
      API_INTERNAL_URL: http://api:3001
    healthcheck:
      # The first request compiles the route in dev mode; a short timeout kills
      # the in-flight compile on every probe and the container never settles.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 60s
      retries: 20
      start_period: 120s
    depends_on:
      api: { condition: service_healthy }
    volumes:
      - .:/workspace
      - web-node-modules:/workspace/node_modules
      - web-next:/workspace/apps/web/.next
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: dev
    env_file: [.env]
    working_dir: /workspace
    command: >
      sh -lc "
        set -e
        bun install
        bun run db:generate
        bun run build:packages
        bun run db:deploy
        bun apps/api/src/scripts/seed-admin.ts ||
          echo 'Owner seeding did not run; the API continues to start. See SEED_ADMIN_ON_START and BHUMIRAJ_ADMIN_* in .env.'
        bun run build:packages:watch &
        exec bun --cwd apps/api start:dev
      "
    environment:
      NODE_ENV: development
      API_PORT: 3001
      APP_URL: http://localhost
      BETTER_AUTH_URL: http://localhost/api/auth
      DATABASE_URL: postgresql://estate:estate@postgres:5432/estate?schema=public
      DIRECT_URL: postgresql://estate:estate@postgres:5432/estate?schema=public
      REDIS_CACHE_URL: redis://redis:6379
      REDIS_CRITICAL_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_AUTO_SETUP: "true"
      S3_CONFIGURE_BUCKET_CORS: "false"
      CDN_BASE_URL: http://localhost:9000/bhumiraj-public
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      BHUMIRAJ_ADMIN_EMAIL: ${BHUMIRAJ_ADMIN_EMAIL:-}
      BHUMIRAJ_ADMIN_PASSWORD: ${BHUMIRAJ_ADMIN_PASSWORD:-}
      BHUMIRAJ_ADMIN_NAME: ${BHUMIRAJ_ADMIN_NAME:-Platform Owner}
      SEED_ADMIN_ON_START: ${SEED_ADMIN_ON_START:-false}
      SEED_ADMIN_RESET: ${SEED_ADMIN_RESET:-false}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    volumes:
      - .:/workspace
      - api-node-modules:/workspace/node_modules
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
      target: dev
    env_file: [.env]
    working_dir: /workspace
    command: >
      sh -lc "
        bun install &&
        exec bun --cwd apps/worker start:dev
      "
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://estate:estate@postgres:5432/estate?schema=public
      DIRECT_URL: postgresql://estate:estate@postgres:5432/estate?schema=public
      REDIS_CACHE_URL: redis://redis:6379
      REDIS_CRITICAL_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    depends_on:
      api: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      clamav: { condition: service_healthy }
    volumes:
      - .:/workspace
      - worker-node-modules:/workspace/node_modules
    restart: unless-stopped

  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_USER: estate
      POSTGRES_PASSWORD: estate
      POSTGRES_DB: estate
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estate -d estate"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost,http://localhost:3000
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  clamav:
    image: clamav/clamav:stable
    ports: ["127.0.0.1:3310:3310"]
    volumes: ["clamav-data:/var/lib/clamav"]
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s

volumes:
  api-node-modules: {}
  web-node-modules: {}
  web-next: {}
  worker-node-modules: {}
  postgres-data: {}
  redis-data: {}
  minio-data: {}
  clamav-data: {}
