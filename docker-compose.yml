name: bhumiraj-estates
services:
  nginx:
    image: nginx:1.29-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: "http://localhost:8080"
        NEXT_PUBLIC_CDN_BASE_URL: "http://localhost:9000/bhumiraj-public"
        NEXT_PUBLIC_UPLOAD_ORIGIN: "http://localhost:9000"
        NEXT_PUBLIC_MAP_STYLE_URL: "https://demotiles.maplibre.org/style.json"
    environment:
      APP_URL: http://localhost:8080
      NEXT_PUBLIC_APP_URL: http://localhost:8080
      NEXT_PUBLIC_CDN_BASE_URL: http://localhost:9000/bhumiraj-public
      API_INTERNAL_URL: http://api:3001
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    env_file: [.env]
    command:
      [
        "sh",
        "-c",
        "node packages/database/node_modules/.bin/prisma migrate deploy --config packages/database/prisma.config.ts && node apps/api/dist/scripts/seed-admin.js && exec node apps/api/dist/main.js",
      ]
    environment:
      API_PORT: 3001
      APP_URL: http://localhost:8080
      BETTER_AUTH_URL: http://localhost:8080/api/auth
      DATABASE_URL: postgresql://estate:estate@postgres:5432/estate?schema=public
      DIRECT_URL: postgresql://estate:estate@postgres:5432/estate?schema=public
      REDIS_CACHE_URL: redis://redis:6379
      REDIS_CRITICAL_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_AUTO_SETUP: "true"
      S3_CONFIGURE_BUCKET_CORS: "false"
      CDN_BASE_URL: http://localhost:9000/bhumiraj-public
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      BHUMIRAJ_ADMIN_EMAIL: ${BHUMIRAJ_ADMIN_EMAIL:-admin@gmail.com}
      BHUMIRAJ_ADMIN_PASSWORD: ${BHUMIRAJ_ADMIN_PASSWORD:-admin@#1234}
      BHUMIRAJ_ADMIN_NAME: ${BHUMIRAJ_ADMIN_NAME:-Admin}
      SEED_ADMIN_ON_START: ${SEED_ADMIN_ON_START:-true}
      SEED_ADMIN_RESET: ${SEED_ADMIN_RESET:-false}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build: { context: ., dockerfile: infrastructure/docker/worker.Dockerfile }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://estate:estate@postgres:5432/estate?schema=public
      DIRECT_URL: postgresql://estate:estate@postgres:5432/estate?schema=public
      REDIS_CACHE_URL: redis://redis:6379
      REDIS_CRITICAL_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    depends_on:
      api: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      clamav: { condition: service_healthy }
    restart: unless-stopped

  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_USER: estate
      POSTGRES_PASSWORD: estate
      POSTGRES_DB: estate
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estate -d estate"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:8080,http://localhost:3000
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  clamav:
    image: clamav/clamav:stable
    ports: ["127.0.0.1:3310:3310"]
    volumes: ["clamav-data:/var/lib/clamav"]
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s

volumes:
  postgres-data: {}
  redis-data: {}
  minio-data: {}
  clamav-data: {}
