map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

map $request_method $write_limit_key {
  default "";
  POST $binary_remote_addr;
  PUT $binary_remote_addr;
  PATCH $binary_remote_addr;
  DELETE $binary_remote_addr;
}

limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=bid_limit:10m rate=6r/s;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=3r/s;
limit_req_zone $write_limit_key zone=api_write_limit:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=socket_connections:10m;

server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 3m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=(self), usb=()" always;
  add_header X-Frame-Options DENY always;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_backend http://api:3001;
  set $web_backend http://web:3000;

  location /socket.io/ {
    limit_conn socket_connections 20;
    proxy_pass $api_backend;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_buffering off;
  }

  location /api/auth/ {
    limit_req zone=auth_limit burst=20 nodelay;
    proxy_pass $api_backend;
    proxy_read_timeout 60s;
    proxy_buffering off;
  }

  location ~ ^/api/v1/auctions/[0-9a-fA-F-]+/bids$ {
    limit_req zone=bid_limit burst=12 nodelay;
    proxy_pass $api_backend;
    proxy_read_timeout 30s;
    proxy_buffering off;
  }

  location ~ ^/api/v1/media/uploads(?:/complete)?$ {
    limit_req zone=upload_limit burst=8 nodelay;
    proxy_pass $api_backend;
    proxy_read_timeout 60s;
    proxy_buffering off;
  }

  location /api/v1/ {
    limit_req zone=api_write_limit burst=60 nodelay;
    proxy_pass $api_backend;
    proxy_read_timeout 60s;
    proxy_buffering off;
  }

  location /_next/static/ {
    proxy_pass $web_backend;
    proxy_cache_bypass $http_upgrade;
    add_header Cache-Control "public,max-age=31536000,immutable";
  }

  location /_next/ {
    proxy_pass $web_backend;
    proxy_cache_bypass $http_upgrade;
  }

  location / {
    proxy_pass $web_backend;
    # Required for streamed React/Next.js responses.
    proxy_buffering off;
  }
}
